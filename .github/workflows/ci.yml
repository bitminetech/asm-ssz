# Generate the vectors and build every target with the pinned toolchain, then
# run every vector file and the bench on each of the 7 supported targets
# (ARCHITECTURE.md sections 1, 9 and 10). RISC-V runs under QEMU, so its bench
# run only checks that the bench works.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Generate vectors
        run: tests/generator/run.sh "$RUNNER_TEMP/vectors"
      - name: Build all targets
        run: docker run --rm -v "$PWD:/src" asm-ssz-build platform/build-all.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build
          path: |
            build/
            !build/deps/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vectors
          path: ${{ runner.temp }}/vectors/*.bin

  linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { isa: x86_64,  runs-on: ubuntu-24.04,     qemu: "" }
          - { isa: arm64,   runs-on: ubuntu-24.04-arm, qemu: "" }
          - { isa: riscv64, runs-on: ubuntu-24.04-arm, qemu: qemu-riscv64 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: vectors, path: vectors }
      - if: matrix.qemu != ''
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Run vectors
        run: |
          chmod +x build/linux-${{ matrix.isa }}/runner
          ${{ matrix.qemu }} build/linux-${{ matrix.isa }}/runner vectors $(cd vectors && ls *.bin)
      - name: Bench
        run: |
          set -o pipefail
          chmod +x build/linux-${{ matrix.isa }}/bench
          ${{ matrix.qemu }} build/linux-${{ matrix.isa }}/bench run vectors ${{ matrix.qemu && '--quick' || '' }} | tee bench-linux-${{ matrix.isa }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bench-linux-${{ matrix.isa }}
          path: bench-linux-${{ matrix.isa }}.txt

  windows:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { isa: x86_64, runs-on: windows-2025 }
          - { isa: arm64,  runs-on: windows-11-arm }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: vectors, path: vectors }
      - name: Run vectors
        shell: pwsh
        run: |
          $files = Get-ChildItem vectors -Filter *.bin | ForEach-Object { $_.Name }
          & "build/windows-${{ matrix.isa }}/runner.exe" vectors @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bench
        shell: pwsh
        run: |
          & "build/windows-${{ matrix.isa }}/bench.exe" run vectors | Tee-Object bench-windows-${{ matrix.isa }}.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bench-windows-${{ matrix.isa }}
          path: bench-windows-${{ matrix.isa }}.txt

  macos:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { isa: x86_64, runs-on: macos-15-intel }
          - { isa: arm64,  runs-on: macos-15 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: vectors, path: vectors }
      - name: Run vectors
        run: tests/runner/macos.sh vectors
      - name: Bench
        run: |
          set -o pipefail
          bench/macos.sh vectors | tee bench-macos-${{ matrix.isa }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bench-macos-${{ matrix.isa }}
          path: bench-macos-${{ matrix.isa }}.txt
